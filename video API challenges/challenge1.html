<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video API Challenge 1</title>
</head>
<body>
    <video controls muted loop autoplay playsinline>
        <source src="media/bog.webm" type="video/webm">
        <source src="media/bog.mp4" type="video/mp4">

        <p>Your browser doesn't support HTML5 video. Here is a <a href="media/bog.mp4">link to the video</a> instead.</p>
    </video>
</body>
</html>
