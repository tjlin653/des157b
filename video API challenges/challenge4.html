<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    
    <title>Video API Challenge 4</title>

    <style>
        #myVid {
            /* max-width: 100vw;
            max-height: 100vh; */
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: 0;
        }

       #fullscreen {
            position: absolute;
            color:orange;
            top: 20px;
            right: 20px;
            font-size: 36px;
            z-index: 1;
        }

        #fullscreen:hover {
            cursor: pointer;
        }

        #sec {
            position: absolute;
            z-index: 2;
        }

        #imgBog {
            bottom: 10%;
            left: 10%;
        }

        #para {
            color: aliceblue;
            bottom: 0%;
            left: 0%;
        }

        .hidden {
            opacity: 0;
        }

        .showing {
            opacity: 1;
        }
    </style>
</head>
<body>
    <section id="sec">
        <img id='imgBog' class='hidden' src="media/bog.jpg" alt="a red-footed tortoise named bog">
        <p id="para" class='hidden'>Lorem ipsum.</p>
    </section>

    <video id='myVid' muted loop autoplay playsinline>
        <source id='myVid' src="media/bog.webm" type="video/webm">
        <source src="media/bog.mp4" type="video/mp4">
        <p>Your browser doesn't support HTML5 video. Here is a <a href="media/bog.mp4">link to the video</a> instead.</p>
    </video>

    <i class="fa-solid fa-expand" id="fullscreen"></i>

    <script>
        (function(){
            'use strict';
            const fs = document.getElementById('fullscreen');
            fs.addEventListener('click', function(){
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            })

            const sec = document.getElementById('sec');
            const para = document.getElementById('para');
            const bog = document.getElementById('imgBog');
            const intervalID = setInterval(checkTime, 1000);
            const myVid = document.getElementById('myVid');
            // function checkTime() {
            //     if (1 < myVid.currentTime && myVid.currentTime < 3) {
            //         para.className = 'showing';
            //     } else {
            //         para.className = 'hidden';
            //     }
            //     if (5 < myVid.currentTime && myVid.currentTime < 7) {
            //         bog.className = 'showing';
            //     } else {
            //         bog.className = 'hidden';
            //     }
            // }

            const poem = {
                start: [1, 5],
                stop: [3, 7],
                line: [myVid]
            }

            function checkTime() {
                for (let i=0; i<poem.start.length; i++) {
                    if (poem.start[i] < myVid.currentTime && myVid.currentTime < poem.stop[i]) {
                        poem.line[i].style.filter = 'blur(10px)';
                    } else {
                        poem.line[i].style.filter = 'grayscale(100%)';
                    }
                }
            }
        })();
    </script>
</body>
</html>
