<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Yourself</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <!-- Add link to any google fonts used here -->
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">

    <!-- My Styles -->
    <link href="styles.css" rel="stylesheet">

    <!-- Meta tag for mobile support -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- My Script -->
    <script src="script.js" defer></script>
</head>
<body>
    <div id="blue-bg"></div>
    <div id="container">
        <h1>April 2026</h1>
        <div id="day-names">
            <h2>Su</h2>
            <h2>Mo</h2>
            <h2>Tu</h2>
            <h2>We</h2>
            <h2>Th</h2>
            <h2>Fr</h2>
            <h2>Sa</h2>
        </div>
        <div class="week">
            <p class="day-num"></p>
            <p class="day-num"></p>
            <p class="day-num"></p>
            <p class="day-num-none">1</p>
            <p class="day-num-none">2</p>
            <p class="day-num-none">3</p>
            <p class="day-num-none">4</p>
        </div>
        <div class="week">
            <p class="day-num-none">5</p>
            <p class="day-num-none">6</p>
            <p class="day-num-none">7</p>
            <p class="day-num-none">8</p>
            <p class="day-num-none">9</p>
            <p class="day-num-none">10</p>
            <p class="day-num-none">11</p>
        </div>
        <div class="week">
            <p class="day-num-none">12</p>
            <p class="day-num-none">13</p>
            <p class="day-num-none">14</p>
            <p class="day-num-none">15</p>
            <p class="day-num">16</p>
            <p class="day-num" id="day-17">17</p>
            <p class="day-num">18</p>
        </div>
        <div class="week">
            <p class="day-num">19</p>
            <p class="day-num">20</p>
            <p class="day-num">21</p>
            <p class="day-num-none">22</p>
            <p class="day-num-none">23</p>
            <p class="day-num-none">24</p>
            <p class="day-num-none">25</p>
        </div>
        <div class="week">
            <p class="day-num-none">26</p>
            <p class="day-num-none">27</p>
            <p class="day-num-none">28</p>
            <p class="day-num-none">29</p>
            <p class="day-num-none">30</p>
            <p class="day-num"></p>
            <p class="day-num"></p>
        </div>
        <div id="timeline-container">
            <div class="timeline-line"></div>
            <div id="paw-print-layer"></div>
            <div class="time-labels">
                <span>0:00</span>
                <span>24:00</span>
            </div>
        </div>
    </div>
    <div id="phone-mockup">
        <video id="cat-video" autoplay loop muted>
            <source src="" type="video/mp4">
        </video>
        <img id="cat-thumbnail" src="images/thumbnail.jpg" alt="cat thumbnail">
        <img id='cat-holding-phone' src="images/cat-phone.svg" alt="Phone Mockup">
    </div>
</body>
</html>
